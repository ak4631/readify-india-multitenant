services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: zerotham
      POSTGRES_USER: zerotham
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - backend_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zerotham -d zerotham"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql://zerotham:${POSTGRES_PASSWORD}@postgres:5432/zerotham
      BACKEND_URL: ""
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  backend_postgres:
